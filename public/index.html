<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#16202e; --mute:#6a7586; --line:#dfe3ea; --accent:#1f4fd8; --me:#e9eefc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f141b; --panel:#171e28; --ink:#e6ebf2; --mute:#8d98a8; --line:#273141; --accent:#7aa2ff; --me:#1d2a46; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  #new { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 100%; }
  .me { align-self: flex-end; background: var(--me); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%; white-space: pre-wrap; }
  .bot p { margin: 0 0 .7em; } .bot ul { margin: 0 0 .7em; padding-left: 1.2em; }
  .bot a { color: var(--accent); } .bot code { background: var(--me); padding: 1px 5px; border-radius: 4px; }
  .status { color: var(--mute); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: p 1s infinite alternate; flex: none; }
  @keyframes p { to { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .status i { animation: none; } }
  .empty { color: var(--mute); margin: 12vh auto 0; text-align: center; max-width: 440px; }
  form { display: flex; gap: 8px; padding: 14px 16px 20px; max-width: 752px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; max-height: 160px; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><b>Chat</b><button id="new" type="button">New chat</button></header>
<main id="main"><div class="wrap" id="log"></div></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask anything. Try: what changed in Postgres hosting prices since last Tuesday?" autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const uid = localStorage.uid ||= crypto.randomUUID();
let chatId = crypto.randomUUID();
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const log = $("log"), main = $("main"), input = $("input"), send = $("send");

function md(s) {
  s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return s.split(/\n{2,}/).map((b) => {
    const ls = b.split("\n");
    return ls.every((l) => /^\s*[-*] /.test(l))
      ? "<ul>" + ls.map((l) => "<li>" + l.replace(/^\s*[-*] /, "") + "</li>").join("") + "</ul>"
      : "<p>" + ls.join("<br>") + "</p>";
  }).join("");
}
const add = (cls, html) => { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.append(d); main.scrollTop = main.scrollHeight; return d; };
const empty = () => { log.innerHTML = '<div class="empty">Ask about prices, releases or news, or about something we discussed earlier. I search the web when the answer can change.</div>'; };
empty();

$("new").onclick = () => { chatId = crypto.randomUUID(); empty(); input.focus(); };
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  if (log.querySelector(".empty")) log.innerHTML = "";
  input.value = ""; input.style.height = "auto"; send.disabled = true;
  add("me", message.replace(/&/g, "&amp;").replace(/</g, "&lt;"));
  const bot = add("bot", ""); let text = "", status = null;
  const setStatus = (t) => { status ||= Object.assign(document.createElement("div"), { className: "status" }); status.innerHTML = "<i></i><span></span>"; status.lastChild.textContent = t; bot.before(status); };
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ userId: uid, chatId, message, tz }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const p of parts) {
        const ev = JSON.parse(p.slice(6));
        if (ev.type === "status") setStatus(ev.text);
        else if (ev.type === "text") { status?.remove(); text += ev.delta; bot.innerHTML = md(text); main.scrollTop = main.scrollHeight; }
        else if (ev.type === "error") bot.innerHTML = md(text + "\n\nSomething went wrong: " + ev.message);
      }
    }
  } catch (err) { bot.textContent = "Connection failed. Is the server running?"; }
  status?.remove(); send.disabled = false; input.focus();
};
</script>
</body>
</html>
